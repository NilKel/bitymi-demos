<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
    <!-- Vite content-hashes the JS/CSS bundles (`index-<hash>.js`), so the
         browser already refetches them on every deploy. The HTML itself is
         the only file with a stable URL, so we add no-cache hints here as
         defense-in-depth. The HF-hosted .bitymi bundles do not change once
         uploaded, so they remain cacheable. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Halloumi-WS · 2DGS + SV viewer</title>
    <script type="module" crossorigin src="./assets/index-515aa55b.js"></script>
    <link rel="stylesheet" href="./assets/index-d92546d3.css">
  </head>
  <body>
    <div id="ui-panel-container" class="ui-panel">
      <button id="load-button" class="ui-button">📂 Load .ply or .bitymi</button>
      <div id="quick-links" class="ui-links"></div>
    </div>
    <canvas id="webgpu-canvas"></canvas>
    
  </body>
</html>
