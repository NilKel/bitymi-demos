<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting to the viewer…</title>
    <meta name="robots" content="noindex" />
    <!-- viewer-ws/ used to hold a second, byte-identical copy of the Halloumi-WS
         build. The gallery's quality switcher pointed every mode here, so every
         demo URL anyone ever copied out of the address bar is a viewer-ws link.
         The build now lives only in viewer/; this stub keeps those links working.
         ?bundle=... and any #hash are carried across unchanged. -->
    <script>
      location.replace('../viewer/index.html' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>This viewer moved. <a id="l" href="../viewer/index.html">Continue to the viewer</a>.</p>
    <script>
      document.getElementById('l').href =
        '../viewer/index.html' + location.search + location.hash;
    </script>
  </body>
</html>
