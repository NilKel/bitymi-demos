<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
    <title>BITYMI window</title>
    <!-- Lightweight embed: one .bitymi rendered behind a fixed "window" frame. The camera
         never leaves the span of the training cameras; pointer hover / touch drag / device
         tilt only slides the eye across that span. Query params: see src/portal/portal-main.ts. -->
    <style>
      :root { --frame: #efe9df; --frame-edge: #cfc6b6; --page: transparent; }
      html, body { height: 100%; margin: 0; background: var(--page); overflow: hidden; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      .portal-frame { position: relative; box-sizing: border-box; padding: var(--pad, 12px);
        border-radius: 16px; background: linear-gradient(150deg, var(--frame), var(--frame-edge));
        box-shadow: 0 18px 44px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.7),
                    inset 0 -2px 3px rgba(0,0,0,.12); }
      .portal-frame.fill { padding: 0; background: none; box-shadow: none; border-radius: 0; }
      .portal-frame.fill .portal-window { border-radius: 0; }
      .portal-frame.fill .portal-glass, .portal-frame.fill .portal-glare { display: none; }
      .portal-ui { display: flex; gap: 8px; z-index: 5; }
      .portal-frame.fill + .portal-ui { position: fixed; right: 12px; bottom: 12px; }
      .portal-ui button { font: 13px/1 ui-sans-serif, system-ui, sans-serif; color: #2a2723; cursor: pointer;
        background: rgba(239,233,223,.92); border: 1px solid rgba(0,0,0,.18); border-radius: 999px;
        padding: 7px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.15); -webkit-tap-highlight-color: transparent; }
      .portal-ui button.on { background: #2a2723; color: #efe9df; }
      .portal-frame.dark { --frame: #2b2d31; --frame-edge: #16171a; }
      .portal-window { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 7px;
        background: #1b1c1f center / cover no-repeat; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0;
        transition: opacity .6s ease; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
      canvas.live { opacity: 1; }
      canvas:active { cursor: grabbing; }
      /* inner reveal shadow = the frame's depth; glare = the pane */
      .portal-glass { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), inset 0 6px 18px rgba(0,0,0,.35), inset 0 0 60px rgba(0,0,0,.18); }
      .portal-glare { position: absolute; inset: -20%; pointer-events: none;
        background: linear-gradient(115deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.035) 50%, rgba(255,255,255,0) 60%);
        transform: translate3d(0,0,0); will-change: transform; }
      .portal-status { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        font: 12px/1.3 ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,.85);
        background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 999px; pointer-events: none;
        transition: opacity .4s ease; white-space: nowrap; }
      .portal-status.hidden { opacity: 0; }
      .ply-spinner-overlay { display: none !important; }  /* loader's own overlay; the portal shows #status */
      .portal-hint { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%;
        background: rgba(0,0,0,.35); color: #fff; font: 14px/26px ui-sans-serif, system-ui, sans-serif;
        text-align: center; pointer-events: none; opacity: 0; transition: opacity .6s ease; }
      .portal-hint.show { opacity: .8; }
    </style>
    <script type="module" crossorigin src="./assets/portal-c4c6c67f.js"></script>
  </head>
  <body>
    <div class="portal-frame" id="frame">
      <div class="portal-window" id="window">
        <canvas id="webgpu-canvas"></canvas>
        <div class="portal-glare" id="glare"></div>
        <div class="portal-glass"></div>
        <div class="portal-hint" id="hint" title="drag or tilt">↔</div>
        <div class="portal-status" id="status">loading…</div>
      </div>
    </div>
    <div class="portal-ui" id="ui">
      <button id="btn-mode" type="button"></button>
      <button id="btn-frame" type="button"></button>
    </div>
    
  </body>
</html>
