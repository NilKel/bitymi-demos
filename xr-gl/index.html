<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Halloumi-GL · WebGL2 splat viewer</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0d12; color: #e6e6e6; font-family: system-ui, sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; display: block; }
  #hud {
    position: fixed; top: 8px; left: 8px; padding: 6px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.55); color: #a0c8ff;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    z-index: 10; pointer-events: none; white-space: pre;
  }
  #err {
    position: fixed; top: 0; left: 0; right: 0; padding: 1em;
    background: #3a0000; color: #ffb0b0;
    font: 0.85rem/1.4 ui-monospace, monospace;
    z-index: 100; white-space: pre-wrap; overflow-x: auto;
    max-height: 60vh; border-bottom: 2px solid #7a0000; display: none;
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">booting…</div>
  <div id="err"></div>
  <script type="module" src="./splat-gl.js"></script>
</body>
</html>
